<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>管理后台 - NinjaTag</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <h1>NinjaTag 后台</h1>
        <nav>
            <a href="index.html">首页</a>
            <a href="#" id="nav-logout">退出</a>
        </nav>
    </header>

    <main class="container">
        <div id="message" class="message" style="display:none"></div>

        <nav class="tabs">
            <button class="tab active" data-tab="event">事件</button>
            <button class="tab" data-tab="colleges">学院</button>
            <button class="tab" data-tab="participants">参与者</button>
            <button class="tab" data-tab="rules">每日规则</button>
            <button class="tab" data-tab="chain">全局链</button>
            <button class="tab" data-tab="eliminations">击杀记录</button>
            <button class="tab" data-tab="reports">举报</button>
        </nav>

        <!-- 事件 -->
        <section class="tab-panel active" id="panel-event">
            <div class="card">
                <h2>事件状态</h2>
                <div id="event-info">加载中...</div>

                <div class="btn-row">
                    <button class="btn-primary" id="btn-start">开始活动</button>
                    <button class="btn-secondary" id="btn-reshuffle">重新打乱存活者</button>
                </div>
                <div class="btn-row">
                    <button class="btn-secondary" id="btn-pause">暂停</button>
                    <button class="btn-secondary" id="btn-resume">继续</button>
                </div>
                <div class="btn-row">
                    <button class="btn-danger" id="btn-end">结束活动</button>
                </div>
            </div>

            <div class="card">
                <h2>事件配置</h2>
                <label>事件名称</label>
                <input type="text" id="event-name">
                <label>当前天数（1-5）</label>
                <input type="number" id="event-day" min="1" max="5">
                <button class="btn-primary" id="btn-save-event">保存</button>
            </div>
        </section>

        <!-- 学院 -->
        <section class="tab-panel" id="panel-colleges">
            <div class="card">
                <h2>学院 / 阵营</h2>
                <div id="colleges-list">加载中...</div>
            </div>
        </section>

        <!-- 参与者 -->
        <section class="tab-panel" id="panel-participants">
            <div class="card">
                <h2>导入参与者（CSV）</h2>
                <p class="hint">格式：email,name,college_name,photo_url（每行一个，第一行可为表头）</p>
                <textarea id="csv-input" rows="6" placeholder="test1@bjsmicschool.com,张三,Red,
test2@bjsmicschool.com,李四,Blue,"></textarea>
                <button class="btn-primary" id="btn-import-csv">导入</button>
            </div>

            <div class="card">
                <h2>添加单个参与者</h2>
                <input type="email" id="p-email" placeholder="邮箱">
                <input type="text" id="p-name" placeholder="姓名">
                <select id="p-college"></select>
                <input type="text" id="p-photo" placeholder="照片 URL（可选）">
                <button class="btn-primary" id="btn-add-participant">添加</button>
            </div>

            <div class="card">
                <h2>参与者列表</h2>
                <input type="text" id="p-search" placeholder="搜索姓名或邮箱">
                <div id="participants-list">加载中...</div>
            </div>
        </section>

        <!-- 每日规则 -->
        <section class="tab-panel" id="panel-rules">
            <div class="card">
                <h2>发布每日规则</h2>
                <label>天数</label>
                <select id="rule-day">
                    <option value="1">Day 1</option>
                    <option value="2">Day 2</option>
                    <option value="3">Day 3</option>
                    <option value="4">Day 4</option>
                    <option value="5">Day 5</option>
                </select>
                <label>标题</label>
                <input type="text" id="rule-title" placeholder="例如 无规则">
                <label>内容</label>
                <textarea id="rule-content" rows="3"></textarea>
                <button class="btn-primary" id="btn-publish-rule">发布</button>
            </div>
            <div class="card">
                <h2>已发布规则</h2>
                <div id="rules-list">加载中...</div>
            </div>
        </section>

        <!-- 全局链 -->
        <section class="tab-panel" id="panel-chain">
            <div class="card">
                <h2>全局链</h2>
                <button class="btn-secondary" id="btn-refresh-chain">刷新</button>
                <div id="chain-list">加载中...</div>
            </div>
        </section>

        <!-- 击杀记录 -->
        <section class="tab-panel" id="panel-eliminations">
            <div class="card">
                <h2>击杀记录</h2>
                <button class="btn-secondary" id="btn-refresh-elims">刷新</button>
                <div id="eliminations-list">加载中...</div>
            </div>
        </section>

        <!-- 举报 -->
        <section class="tab-panel" id="panel-reports">
            <div class="card">
                <h2>举报列表</h2>
                <button class="btn-secondary" id="btn-refresh-reports">刷新</button>
                <div id="reports-list">加载中...</div>
            </div>
        </section>
    </main>

    <script type="module" src="js/admin.js"></script>
</body>

</html>
