<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="register.pageTitle">注册 - NinjaTag</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <h1>NinjaTag</h1>
        <nav>
            <a href="index.html" data-i18n="header.home">首页</a>
            <a href="login.html" data-i18n="header.login">登录</a>
            <div id="lang-switch"></div>
        </nav>
    </header>
    <main class="container">
        <section class="card">
            <h2 data-i18n="register.title">注册管理员</h2>
            <p class="hint" data-i18n="register.subtitle">输入学校邮箱，我们会发送一封注册邮件。点击邮件中的链接后，将进入设置密码页面。</p>
            <div id="message" class="message" style="display:none"></div>
            <div id="step-email">
                <div class="field">
                    <label for="email" data-i18n="register.emailLabel">学校邮箱</label>
                    <input type="email" id="email" data-i18n-placeholder="register.emailPlaceholder"
                        placeholder="your@school.edu" autocomplete="email">
                </div>
                <button id="btn-send" class="btn btn-primary btn-block" data-i18n="register.submit">发送注册邮件</button>
            </div>
            <div id="step-sent" style="display:none">
                <p data-i18n="register.sentMessage">注册邮件已发送，请查收并点击邮件中的链接。</p>
                <p class="hint" style="margin-top:8px" data-i18n="register.sentHint">如果没有收到，请检查垃圾邮件。</p>
                <p class="hint" style="margin-top:16px" data-i18n="register.note">注意：只有被管理员添加到名单中的邮箱才能进入后台。</p>
            </div>
        </section>
    </main>
    <script type="module" src="js/register.js"></script>
</body>

</html>
