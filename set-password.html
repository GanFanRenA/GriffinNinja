<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="setpwd.pageTitle">设置密码 - NinjaTag</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <h1>NinjaTag</h1>
        <nav>
            <a href="index.html" data-i18n="header.home">首页</a>
            <div id="lang-switch"></div>
        </nav>
    </header>
    <main class="container">
        <section class="card">
            <h2 data-i18n="setpwd.title">设置密码</h2>
            <p class="hint" data-i18n="setpwd.subtitle">为你的账号设置一个密码，之后就可以用邮箱和密码登录。</p>
            <div id="message" class="message" style="display:none"></div>
            <div id="loading" data-i18n="setpwd.verifying">正在验证身份...</div>
            <div id="step-password" style="display:none">
                <p class="hint" style="margin-bottom:12px">
                    <span data-i18n="setpwd.confirmedEmail">已确认邮箱：</span>
                    <strong id="user-email">-</strong>
                </p>
                <div class="field">
                    <label for="password" data-i18n="setpwd.newPassword">新密码</label>
                    <input type="password" id="password" data-i18n-placeholder="setpwd.newPasswordPlaceholder"
                        placeholder="至少 6 位" autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="password2" data-i18n="setpwd.confirmPassword">确认密码</label>
                    <input type="password" id="password2" data-i18n-placeholder="setpwd.confirmPasswordPlaceholder"
                        placeholder="再输入一次" autocomplete="new-password">
                </div>
                <button id="btn-set" class="btn btn-primary btn-block" data-i18n="setpwd.submit">设置密码并进入后台</button>
            </div>
        </section>
    </main>
    <script type="module" src="js/set-password.js"></script>
</body>

</html>
